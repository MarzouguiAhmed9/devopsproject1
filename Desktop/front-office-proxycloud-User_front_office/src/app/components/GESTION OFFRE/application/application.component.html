<div *ngIf="selectedOffer" class="min-h-screen bg-gray-100 flex items-center justify-center p-8">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-12">
    <h2 class="text-4xl font-bold mb-8 text-center">Apply for: {{ selectedOffer.title }}</h2>

    <form [formGroup]="applicationForm" (ngSubmit)="submitApplication()" enctype="multipart/form-data" class="space-y-6">

      <div>
        <label class="block text-lg font-semibold text-gray-700 mb-2">Motivation Letter</label>
        <textarea formControlName="motivatedLetter"
                  class="w-full h-40 rounded-xl border-gray-300 shadow-sm focus:ring-pink-500 focus:border-pink-500 p-4"
                  placeholder="Write your motivation here...">
        </textarea>
      </div>

      <div>
        <label class="block text-lg font-semibold text-gray-700 mb-2">Username</label>
        <input formControlName="username" type="text"
               class="w-full rounded-xl border-gray-300 shadow-sm focus:ring-pink-500 focus:border-pink-500 p-4"
               placeholder="Enter your username" />
      </div>

      <div>
        <label class="block text-lg font-semibold text-gray-700 mb-2">Upload your CV (PDF)</label>
        <input type="file" (change)="onFileSelected($event)"
               accept=".pdf"
               class="w-full rounded-xl border-gray-300 shadow-sm focus:ring-pink-500 focus:border-pink-500 p-4 bg-white" />
      </div>

      <div *ngIf="uploadedCvName" class="text-green-600 font-medium">
        Selected File: {{ uploadedCvName }}
      </div>

      <div class="flex justify-between items-center">
        <button type="submit"
                class="bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition">
          Apply Offer
        </button>

        <!-- Download Example CV Button -->
        <a href="URL_TO_YOUR_GENERATED_CV.pdf" target="_blank"
           class="text-pink-600 font-semibold underline hover:text-pink-800">
          Download your CV
        </a>
      </div>
    </form>
  </div>
</div>
