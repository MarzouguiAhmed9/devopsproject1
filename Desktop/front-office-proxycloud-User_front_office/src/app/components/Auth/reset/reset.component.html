<form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="max-w-sm mx-auto">
    <div class="mb-5">
      <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
        Nouveau mot de passe
      </label>
      <input
        type="password"
        id="password"
        formControlName="password"
        class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
               dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white
               dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-xs-light"
        required
      />
      <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-sm mt-1">
        Le mot de passe doit contenir au moins 6 caractères.
      </div>
    </div>
  
    <div class="mb-5">
      <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
        Confirmez le mot de passe
      </label>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
        class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
               dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white
               dark:focus:ring-blue-500 dark:focus:border-blue-500 dark:shadow-xs-light"
        required
      />
      <div *ngIf="resetPasswordForm.hasError('passwordMismatch') && confirmPassword?.touched"
           class="text-red-500 text-sm mt-1">
        Les mots de passe ne correspondent pas.
      </div>
    </div>
  
    <button
      type="submit"
      [disabled]="resetPasswordForm.invalid"
      class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none
             focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center
             dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Réinitialiser le mot de passe
    </button>
  </form>
