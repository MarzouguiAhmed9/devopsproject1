<form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="max-w-sm mx-auto">
    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
      Votre adresse email
    </label>
  
    <input
      type="email"
      id="email"
      formControlName="email"
      aria-describedby="helper-text-explanation"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
             focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5
             dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white
             dark:focus:ring-blue-500 dark:focus:border-blue-500"
      placeholder="name@flowbite.com"
    />
  
    <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-red-500 text-sm mt-1">
      <span *ngIf="email?.errors?.['required']">L'email est requis.</span>
      <span *ngIf="email?.errors?.['email']">Format d'email invalide.</span>
    </div>
  
    <p id="helper-text-explanation" class="mt-2 text-sm text-gray-500 dark:text-gray-400">
      Nous ne partagerons jamais vos informations. Lisez notre
      <a href="#" class="font-medium text-blue-600 hover:underline dark:text-blue-500">Politique de confidentialité</a>.
    </p>
  
    <button
      type="submit"
      [disabled]="forgotForm.invalid"
      class="mt-4 w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none
             focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center
             dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Envoyer
    </button>
  
    <p *ngIf="successMessage" class="mt-4 text-green-600 dark:text-green-400 text-sm">
      {{ successMessage }}
    </p>
  
    <p *ngIf="errorMessage" class="mt-4 text-red-600 dark:text-red-400 text-sm">
      {{ errorMessage }}
    </p>
  </form>
